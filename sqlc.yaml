# Queries are grouped one directory per area under server/internal/db/queries,
# and every area generates into the one gen package, so query names are unique
# across areas. sqlc reads a directory one level deep, so the areas are listed
# by glob. The schema is the goose migrations; sqlc drops each Down section and
# ignores CREATE EXTENSION, CREATE INDEX, triggers, DML and every constraint but
# a primary key. The overrides keep pgtype out of the signatures consumers see
# and mock; numeric is named pg_catalog.numeric because the parser qualifies
# it, and an override naming a type the parser does not is silently unmatched.
# The identifier_type override points at a hand written enum, so that it and the
# identifiers it types sit where generated code and its consumers can both name
# them. sqlc emits its own copy regardless, which a lint rule forbids.
version: "2"
sql:
  - engine: postgresql
    schema: server/internal/migrations
    queries:
      - server/internal/db/queries/*
    gen:
      go:
        package: gen
        out: server/internal/db/gen
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: identifier_type
            go_type:
              import: github.com/leedenison/stonks/server/internal/db/types
              type: IdentifierType
          - db_type: identifier_type
            nullable: true
            go_type:
              import: github.com/leedenison/stonks/server/internal/db/types
              type: IdentifierType
              pointer: true
          - column: stated_keys.identifiers
            go_type:
              import: github.com/leedenison/stonks/server/internal/db/types
              type: Identifier
              slice: true
