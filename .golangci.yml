# The standard set plus gosec, and the rules that carry the conventions a
# linter can check: configuration is read only in server/internal/config,
# connect is imported only at the service boundary, logging is log/slog,
# context.TODO is confined to tests, and every nolint names its linter and
# says why. govet is make vet.
version: "2"

# A test that needs the test stack carries the dbtest build tag. Nothing is
# built only when the tag is absent, so linting the tagged configuration covers
# every file in one pass.
run:
  build-tags:
    - dbtest

linters:
  default: standard
  disable:
    - govet
  enable:
    - depguard
    - forbidigo
    - gosec
    - nolintlint
  settings:
    # errcheck already reports G104. G115 and G304 flag every integer
    # conversion and every file read from a variable path.
    gosec:
      excludes:
        - G104
        - G115
        - G304
    nolintlint:
      require-explanation: true
      require-specific: true
    # Not a gate: make dupes runs dupl for the quality review. jscpd uses the
    # same threshold for TypeScript.
    dupl:
      threshold: 75
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv)$
          msg: configuration is read only in server/internal/config
        - pattern: ^context\.TODO$
          msg: take a context.Context from the caller, or context.Background at the root
        # The enum and its constants, leaving the identifier_type_traits row.
        - pattern: ^gen\.IdentifierType($|[^T]|T[^r])
          msg: sqlc still emits this enum, but the columns take types.IdentifierType
    depguard:
      rules:
        service-boundary:
          files:
            - "!**/server/cmd/**"
            - "!**/server/internal/service/**"
          deny:
            - pkg: connectrpc.com/connect
              desc: connect is imported only at the service boundary
        logging:
          list-mode: lax
          files:
            - "!$test"
          allow:
            - log/slog
          deny:
            - pkg: log
              desc: logging is log/slog through server/internal/logger
            - pkg: github.com/sirupsen/logrus
              desc: logging is log/slog through server/internal/logger
            - pkg: go.uber.org/zap
              desc: logging is log/slog through server/internal/logger
            - pkg: github.com/rs/zerolog
              desc: logging is log/slog through server/internal/logger
  exclusions:
    rules:
      - path: server/internal/config/
        linters:
          - forbidigo
      # Tests read the STONKS_TEST_* variables that configure the test stack.
      - path: _test\.go
        linters:
          - forbidigo
      # The recorder is provisioned by STONKS_RECORD and by whatever variable
      # holds the credential of the provider being recorded.
      - path: server/internal/testutil/
        linters:
          - forbidigo
      # vcrproxy records with the credential in the variable its hosts file
      # names for each provider.
      - path: server/cmd/vcrproxy/
        linters:
          - forbidigo
      # Test credentials are invented.
      - path: _test\.go
        linters:
          - gosec
        text: G101
      # The healthcheck fetches the URL it is given.
      - path: server/cmd/healthcheck/
        linters:
          - gosec
        text: G704
      # An integration's requests go to the endpoint an administrator gives
      # its datasource.
      - path: server/internal/market/http\.go
        linters:
          - gosec
        text: G704

# The defaults cap output per linter and per repeated issue, which makes a
# truncated run read as a nearly clean one.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
