// Holdings: what a user holds, of two kinds, one per instrument and one per
// group of unresolved keys. A sum of zero is no holding. Quantities are raw: no
// corporate event restates them. Every RPC requires a session and reads the
// caller's own transactions, keys and statements. A holding carries the keys
// it sums. An instrument holding also carries its listings.

syntax = "proto3";

package stonks.holding.v1;

import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/holding/v1;holdingv1";

// One listing of a held instrument, named for the user.
message HoldingListing {
  // The listing; a UUID.
  string id = 1;
  // The currency's family code, such as GBP for pence.
  string currency = 2;
  // The ticker that names the listing: at the venue a datasource stated as
  // primary, else at the venue ranked first among those where the listing
  // has tickers, else at the first by MIC. Unset where the listing has no
  // ticker.
  stonks.type.v1.Identifier ticker = 3;
  // The venue's common name, or its MIC where it has none. Empty where
  // ticker is unset.
  string venue = 4;
}

// One of the caller's keys contributing to a holding.
message HoldingKey {
  stonks.type.v1.StatedKey stated_key = 1;
  // The listing the key associates through; empty where it names none.
  string listing_id = 2;
  // The sum of the key's transaction quantities.
  string quantity = 3;
}

// A holding of an instrument a datasource named, across its listings.
message InstrumentHolding {
  // The instrument held; a UUID.
  string instrument_id = 1;
  // The narrowest class known for the instrument.
  stonks.type.v1.AssetClass asset_class = 2;
  // Every identifier naming the instrument or one of its listings. Empty
  // when nothing names it.
  repeated stonks.type.v1.Identifier identifiers = 3;
  // The sum of the caller's transaction quantities over every key resolved to
  // the instrument: shares, contracts, or money for cash, with no trailing
  // zeros. Negative when more has been disposed of than acquired.
  string quantity = 4;
  // Every listing of the instrument, by currency.
  repeated HoldingListing listings = 5;
  // The keys this holding sums, newest statement first.
  repeated HoldingKey keys = 6;
}

// A holding of the caller's unresolved keys that state one holding between
// them, gathered by what they state in common. It rests on the caller's
// statements alone.
message GroupHolding {
  // Identifies the group; a UUID. It is the id of the group's earliest key,
  // so it changes as keys join and leave.
  string group_id = 1;
  // Each class the keys state, once, in the order the tree declares them.
  // Empty when none stated one.
  repeated stonks.type.v1.AssetClass asset_classes = 2;
  // Each identifier the keys state, once. When a ticker is stated without
  // its venue, it is among them, and so is each broker's description.
  repeated stonks.type.v1.Identifier identifiers = 3;
  // The sum of the caller's transaction quantities over the group's keys,
  // with no trailing zeros.
  string quantity = 4;
  // The keys this holding sums, newest statement first.
  repeated HoldingKey keys = 5;
}

message ListHoldingsRequest {}

message ListHoldingsResponse {
  // In no particular order.
  repeated InstrumentHolding instruments = 1;
  // In no particular order.
  repeated GroupHolding groups = 2;
}

service HoldingService {
  // Lists the caller's holdings of both kinds.
  rpc ListHoldings(ListHoldingsRequest) returns (ListHoldingsResponse);
}
