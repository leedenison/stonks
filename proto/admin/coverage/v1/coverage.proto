// Where each ticker's validity is confirmed and where it is not, and
// identifier attestation of what no datasource covers.

syntax = "proto3";

package stonks.admin.coverage.v1;

import "admin/run/v1/run.proto";
import "buf/validate/validate.proto";
import "run/v1/run.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/coverage/v1;admincoveragev1";

// A part of a ticker's transaction period that no confirmed ticker validity
// holds. The period runs from the earliest transaction whose key states the
// ticker up to and including today. The bounds are half open, as YYYY-MM-DD.
message Gap {
  string unconfirmed_from = 1;
  string unconfirmed_before = 2;
  // The keys that state the ticker and have a transaction dated inside the
  // gap, whether or not they resolved.
  int32 keys = 3;
  // Their transactions dated inside the gap.
  int32 txns = 4;
}

// A period over which one datasource reported every edge of a ticker. The
// bounds are half open, as YYYY-MM-DD.
message AssertionCoverage {
  string datasource = 1;
  string covered_from = 2;
  string covered_before = 3;
}

enum TickerValidity {
  TICKER_VALIDITY_UNSPECIFIED = 0;
  TICKER_VALIDITY_CONFIRMED = 1;
  TICKER_VALIDITY_PROVISIONAL = 2;
}

// The days over which a ticker names one instrument. The bounds are half
// open, as YYYY-MM-DD, and an unset bound is open.
message Interval {
  optional string valid_from = 1;
  optional string valid_before = 2;
  string instr_id = 3;
  TickerValidity validity = 4;
}

// An instrument and the identifier that names it.
message InstrName {
  string id = 1;
  stonks.type.v1.Identifier name = 2;
}

// One ticker's facts and the ticker validity they derive.
message Ticker {
  stonks.type.v1.MarketTicker ticker = 1;
  // The distinct as-at dates of the transactions whose keys state the
  // ticker, as YYYY-MM-DD, in order.
  repeated string txn_days = 2;
  // By datasource, then first day.
  repeated AssertionCoverage assertion_coverage = 3;
  // By day.
  repeated stonks.admin.run.v1.AssertionItem assertions = 4;
  // In order, without overlap.
  repeated Interval intervals = 5;
  // By first day.
  repeated Gap gaps = 6;
  // Every instrument the assertions and intervals name.
  repeated InstrName instrs = 7;
}

// A ticker at its market that names the instrument, or that an assertion
// gives as the instrument's name.
message InstrTicker {
  stonks.type.v1.MarketTicker ticker = 1;
  stonks.type.v1.TickerRelation relation = 2;
  // The transactions whose keys state the ticker at any venue of its market,
  // under any instrument.
  int32 txns = 3;
  // The operating MICs of the venues at which the ticker names the
  // instrument, sorted.
  repeated string venues = 4;
}

message ListInstrTickersRequest {
  string instr_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListInstrTickersResponse {
  // By transactions, most first, then current, defunct and former, then
  // market and value.
  repeated InstrTicker tickers = 1;
}

message GetTickerRequest {
  stonks.type.v1.MarketTicker ticker = 1 [(buf.validate.field).required = true];
}

message GetTickerResponse {
  Ticker ticker = 1;
}

message AttestIdentifierRequest {
  stonks.type.v1.MarketTicker ticker = 1 [(buf.validate.field).required = true];
  // What the ticker names on each day.
  oneof names {
    option (buf.validate.oneof).required = true;
    string instr_id = 2 [(buf.validate.field).string.uuid = true];
    // The ticker names nothing.
    bool nothing = 3 [(buf.validate.field).bool.const = true];
  }
  // The first day the assertion holds, as YYYY-MM-DD.
  string from = 4 [(buf.validate.field).string.min_len = 1];
  // The last day the assertion holds, as YYYY-MM-DD. Unset for from alone.
  optional string to = 5;
}

message AttestIdentifierResponse {
  // The attest identifier run, pending.
  stonks.run.v1.Run run = 1;
}

message WithdrawIdentifierAttestationRequest {
  string assertion_id = 1 [(buf.validate.field).string.uuid = true];
}

message WithdrawIdentifierAttestationResponse {}

// Reads where each ticker's validity is confirmed, and attests what no
// datasource covers.
service CoverageService {
  // Lists the tickers that name the instrument, now or in an assertion.
  rpc ListInstrTickers(ListInstrTickersRequest) returns (ListInstrTickersResponse);
  // Reads one ticker's facts and validity. An unknown market is refused as an
  // invalid argument.
  rpc GetTicker(GetTickerRequest) returns (GetTickerResponse);
  // Attests, as a system run, that the ticker names the instrument or names
  // nothing on every day of the range from through to. The assertion is written
  // before the call returns, and the run replays the unresolved keys that state
  // the ticker. A day after today, or a to before from, is a failed
  // precondition.
  rpc AttestIdentifier(AttestIdentifierRequest) returns (AttestIdentifierResponse);
  // Deletes an attested assertion and replays the unresolved keys that state
  // its ticker beneath the run that wrote it, before it returns. A
  // datasource's assertion is a failed precondition.
  rpc WithdrawIdentifierAttestation(WithdrawIdentifierAttestationRequest) returns (WithdrawIdentifierAttestationResponse);
}
