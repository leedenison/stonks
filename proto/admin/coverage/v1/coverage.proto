// Where each ticker's validity is confirmed and where it is not, and
// attestation of what no datasource covers.

syntax = "proto3";

package stonks.admin.coverage.v1;

import "admin/run/v1/run.proto";
import "buf/validate/validate.proto";
import "run/v1/run.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/coverage/v1;admincoveragev1";

// A part of a ticker's transaction period that no confirmed validity holds.
// The period runs from the earliest transaction whose key states the ticker
// up to and including today. The bounds are half open, as YYYY-MM-DD.
message Gap {
  string unconfirmed_from = 1;
  string unconfirmed_before = 2;
  // The keys that state the ticker and have a transaction dated inside the
  // gap, whether or not they resolved.
  int32 keys = 3;
  // Their transactions dated inside the gap.
  int32 transactions = 4;
}

// A period over which one datasource answered for a ticker, or for every
// ticker of its market. The bounds are half open, as YYYY-MM-DD.
message Coverage {
  string datasource = 1;
  string market = 2;
  // The ticker's value; unset where the row covers every ticker of the
  // market.
  optional string value = 3;
  string covered_from = 4;
  string covered_before = 5;
}

enum IdentifierEventAction {
  IDENTIFIER_EVENT_ACTION_UNSPECIFIED = 0;
  IDENTIFIER_EVENT_ACTION_ASSIGNED = 1;
  IDENTIFIER_EVENT_ACTION_RENAMED = 2;
  IDENTIFIER_EVENT_ACTION_RETIRED = 3;
}

// A change a datasource reported in what a ticker names, taking effect at
// the start of its day.
message IdentifierEvent {
  string effective_on = 1;
  IdentifierEventAction action = 2;
  // The ticker the event names; the old ticker of a rename.
  string value = 3;
  // The new ticker of a rename; empty otherwise.
  string to_value = 4;
}

enum Validity {
  VALIDITY_UNSPECIFIED = 0;
  VALIDITY_CONFIRMED = 1;
  VALIDITY_PROVISIONAL = 2;
}

// The days over which a ticker names one instrument. The bounds are half
// open, as YYYY-MM-DD, and an unset bound is open.
message Interval {
  optional string valid_from = 1;
  optional string valid_before = 2;
  string instrument_id = 3;
  Validity validity = 4;
}

// An instrument and the identifier that names it.
message InstrumentName {
  string id = 1;
  stonks.type.v1.Identifier name = 2;
}

// One ticker's facts and the validity they derive.
message Ticker {
  stonks.type.v1.MarketTicker ticker = 1;
  // The distinct as-at dates of the transactions whose keys state the
  // ticker, as YYYY-MM-DD, in order.
  repeated string transaction_days = 2;
  // By datasource, then first day.
  repeated Coverage coverage = 3;
  // By day.
  repeated stonks.admin.run.v1.AssertionItem assertions = 4;
  // By day.
  repeated IdentifierEvent events = 5;
  // In order, without overlap.
  repeated Interval intervals = 6;
  // By first day.
  repeated Gap gaps = 7;
  // Every instrument the assertions and intervals name.
  repeated InstrumentName instruments = 8;
}

// A ticker at its market that a listing of the instrument carries, or that
// an assertion gives as the instrument's name.
message InstrumentTicker {
  stonks.type.v1.MarketTicker ticker = 1;
  // A listing of the instrument carries the ticker.
  bool current = 2;
  // The transactions whose keys state the ticker at any venue of its market,
  // under any instrument.
  int32 transactions = 3;
  // The operating MICs of the listings that carry the ticker, sorted.
  repeated string venues = 4;
}

message ListInstrumentTickersRequest {
  string instrument_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListInstrumentTickersResponse {
  // By transactions, most first, then current before former, then market
  // and value.
  repeated InstrumentTicker tickers = 1;
}

message GetTickerRequest {
  stonks.type.v1.MarketTicker ticker = 1 [(buf.validate.field).required = true];
}

message GetTickerResponse {
  Ticker ticker = 1;
}

message AttestRequest {
  stonks.type.v1.MarketTicker ticker = 1 [(buf.validate.field).required = true];
  // What the ticker names on each day.
  oneof names {
    option (buf.validate.oneof).required = true;
    string instrument_id = 2 [(buf.validate.field).string.uuid = true];
    // The ticker names nothing.
    bool nothing = 3 [(buf.validate.field).bool.const = true];
  }
  // The day the assertion holds, as YYYY-MM-DD.
  string from = 4 [(buf.validate.field).string.min_len = 1];
  // A later day that takes an assertion of its own, as YYYY-MM-DD.
  optional string to = 5;
}

message AttestResponse {
  // The attestation run, pending.
  stonks.run.v1.Run run = 1;
}

message WithdrawAttestationRequest {
  string assertion_id = 1 [(buf.validate.field).string.uuid = true];
}

message WithdrawAttestationResponse {}

// Reads where each ticker's validity is confirmed, and attests what no
// datasource covers.
service CoverageService {
  // Lists the tickers that name the instrument, now or in an assertion.
  rpc ListInstrumentTickers(ListInstrumentTickersRequest) returns (ListInstrumentTickersResponse);
  // Reads one ticker's facts and validity. An unknown market is refused as an
  // invalid argument.
  rpc GetTicker(GetTickerRequest) returns (GetTickerResponse);
  // Attests, as a system run, that the ticker names the instrument or names
  // nothing on from, and on to where it is given. The assertions are written
  // before the call returns, and the run replays the unresolved keys that
  // state the ticker. A day after today, or a to before from, is a failed
  // precondition.
  rpc Attest(AttestRequest) returns (AttestResponse);
  // Deletes an attested assertion and replays the unresolved keys that state
  // its ticker beneath the run that wrote it, before it returns. A
  // datasource's assertion is a failed precondition.
  rpc WithdrawAttestation(WithdrawAttestationRequest) returns (WithdrawAttestationResponse);
}
