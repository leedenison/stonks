// Rebuilding resolved tickers: runs an administrator starts to rebuild the
// ticker validity and names of every ticker.

syntax = "proto3";

package stonks.admin.rebuild_resolved_tickers.v1;

import "run/v1/run.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/rebuild_resolved_tickers/v1;adminrebuildresolvedtickersv1";

message StartRebuildResolvedTickersRequest {}

message StartRebuildResolvedTickersResponse {
  // The rebuild resolved tickers run, pending.
  stonks.run.v1.Run run = 1;
}

// Starts rebuild resolved tickers runs.
service RebuildResolvedTickersService {
  // Starts a rebuild resolved tickers run over every ticker, as a system run.
  // An administrator starts one after a deploy that changes how names are
  // chosen, or after a deletion that removed facts.
  rpc StartRebuildResolvedTickers(StartRebuildResolvedTickersRequest) returns (StartRebuildResolvedTickersResponse);
}
