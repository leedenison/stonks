// Refreshing corporate actions: runs an administrator starts to ask the
// datasources again for the corporate actions of the tickers that named a held
// instrument.

syntax = "proto3";

package stonks.admin.refresh_corp_acts.v1;

import "run/v1/run.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/refresh_corp_acts/v1;adminrefreshcorpactsv1";

message StartRefreshCorpActsRequest {}

message StartRefreshCorpActsResponse {
  // The refresh corporate actions run, pending.
  stonks.run.v1.Run run = 1;
}

// Starts refresh corporate actions runs.
service RefreshCorpActsService {
  // Starts a refresh corporate actions run over the tickers that named a held
  // instrument, as a system run. Each enabled datasource that serves corporate
  // actions is asked once about each ticker, skipping the cache, and spends its
  // quota on the calls. Where no instrument is held, the call is refused as a
  // failed precondition.
  rpc StartRefreshCorpActs(StartRefreshCorpActsRequest) returns (StartRefreshCorpActsResponse);
}
