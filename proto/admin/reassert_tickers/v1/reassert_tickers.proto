// Reasserting tickers: runs an administrator starts to ask the datasources
// again about every held ticker.

syntax = "proto3";

package stonks.admin.reassert_tickers.v1;

import "run/v1/run.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/reassert_tickers/v1;adminreasserttickersv1";

message StartReassertTickersRequest {}

message StartReassertTickersResponse {
  // The reassert tickers run, pending.
  stonks.run.v1.Run run = 1;
}

// Starts reassert tickers runs.
service ReassertTickersService {
  // Starts a reassert tickers run over every held ticker, as a system run.
  // Each enabled datasource is asked once about each ticker, and spends its
  // quota on the calls. Where no ticker is held, the call is refused as a failed
  // precondition.
  rpc StartReassertTickers(StartReassertTickersRequest) returns (StartReassertTickersResponse);
}
