// Every instrument, with its identifiers and listings.

syntax = "proto3";

package stonks.admin.instr.v1;

import "buf/validate/validate.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/instr/v1;admininstrv1";

// One trading currency of an instrument.
message Listing {
  // Identifies the listing in every API; a UUID.
  string id = 1;
  // The listing's currency code; a family code, so a listing quoted in pence
  // is the GBP listing.
  string currency = 2;
  // The listing grain identifiers naming it, by the rank of the type as a
  // name, then by domain and value. A ticker is not among them.
  repeated stonks.type.v1.Identifier identifiers = 3;
  // The operating MIC of the venue a datasource stated as the listing's
  // primary; empty where none has.
  string primary_mic = 4;

  // A ticker that ticker validity places on the instrument, in a currency of
  // the listing's family.
  message Ticker {
    stonks.type.v1.MarketTicker ticker = 1;
    // The operating MIC of the venue; unset where the sources omitted the
    // venue, so the ticker names the listing at its market.
    optional string mic = 2;
    stonks.type.v1.TickerRelation relation = 3;
  }

  // The listing's tickers in its naming order: the primary venue, then the
  // venue rank, then the MIC.
  repeated Ticker tickers = 5;
}

message Instr {
  // Identifies the instrument in every API; a UUID.
  string id = 1;
  // The identifier that names the instrument, chosen by the rank of its
  // type, then by the listing's naming order; unset where it has none.
  stonks.type.v1.Identifier name = 2;
  // The narrowest class known for the instrument.
  stonks.type.v1.AssetClass asset_class = 3;
  // The instrument grain identifiers naming it, by the rank of the type as a
  // name, then by domain and value. Empty when only its listings are named.
  repeated stonks.type.v1.Identifier identifiers = 4;
  // One per currency family the instrument trades in: a listing with a
  // primary venue first, then by currency.
  repeated Listing listings = 5;
  // The via identifiers of the stated keys that resolved to the instrument,
  // at either grain. Empty where no key has.
  repeated stonks.type.v1.Identifier via = 6;
}

message ListInstrsRequest {
  // At most this many instruments; 0 means 50.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The next_page_token of the previous page; empty for the first.
  string page_token = 2;
  // Keeps the instruments with an identifier that contains it, ignoring
  // case. Empty keeps every instrument.
  string query = 3 [(buf.validate.field).string.max_len = 100];
  // Keeps the instruments of this class and of the classes below it. Absent
  // keeps every class.
  optional stonks.type.v1.AssetClass asset_class = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ListInstrsResponse {
  // By name, then by id.
  repeated Instr instrs = 1;
  // Continues the listing; empty on the last page.
  string next_page_token = 2;
}

service InstrService {
  // Lists every instrument, each with its identifiers and listings.
  rpc ListInstrs(ListInstrsRequest) returns (ListInstrsResponse);
}
