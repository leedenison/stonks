// Read what runs did across every user. Every RPC here requires the admin
// role.

syntax = "proto3";

package stonks.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "run/v1/run.proto";
import "statement/v1/statement.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/v1;adminv1";

// A run and the user it belongs to.
message UserRun {
  stonks.run.v1.Run run = 1;
  string user_id = 2;
  string user_email = 3;
}

// What a run of kind RESOLUTION made of one stated key.
enum ResolutionOutcome {
  RESOLUTION_OUTCOME_UNSPECIFIED = 0;
  // The key was associated with an instrument.
  RESOLUTION_OUTCOME_MATCHED = 1;
  // The key was attempted and nothing answered for it.
  RESOLUTION_OUTCOME_UNRESOLVED = 2;
  // The key could not be attempted.
  RESOLUTION_OUTCOME_REJECTED = 3;
}

message ResolutionItem {
  stonks.type.v1.StatedKey stated_key = 1;
  string stated_key_id = 2;
  ResolutionOutcome outcome = 3;
  // Why the key was rejected; set only when the outcome is REJECTED.
  optional string reason = 4;
}

// What one key of a fetch got.
enum FetchOutcome {
  FETCH_OUTCOME_UNSPECIFIED = 0;
  // The datasource returned a result set, possibly empty.
  FETCH_OUTCOME_SERVED = 1;
  // The integration declared the key out of its scope, so no call was made.
  FETCH_OUTCOME_NOT_SERVED = 2;
  // An open block suppressed the call.
  FETCH_OUTCOME_BLOCKED = 3;
  FETCH_OUTCOME_FAILED_TEMPORARY = 4;
  FETCH_OUTCOME_FAILED_PERMANENT = 5;
}

message FetchItem {
  stonks.type.v1.StatedKey stated_key = 1;
  string stated_key_id = 2;
  FetchOutcome outcome = 3;
  // The number of calls the key rode in.
  int32 attempts = 4;
  // The identifier the key was sent under; unset when it was not served.
  stonks.type.v1.Identifier sent = 5;
  // The datasource's error; unset when the key was served.
  optional string reason = 6;
}

enum FindingKind {
  FINDING_KIND_UNSPECIFIED = 0;
  // The run wrote a datasource block, which withholds calls until an
  // administrator clears it.
  FINDING_KIND_BLOCK = 1;
}

// Something a run met that an administrator may need to see.
message Finding {
  string id = 1;
  string run_id = 2;
  FindingKind kind = 3;
  // The block reported; set only when the kind is BLOCK.
  optional string block_id = 4;
  google.protobuf.Timestamp created_at = 5;
  // When an administrator cleared the finding; unset while it is open.
  google.protobuf.Timestamp cleared_at = 6;
}

message ListRunsRequest {
  // Each filter left unset matches every run.
  optional stonks.run.v1.RunKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional stonks.run.v1.RunTrigger trigger = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional stonks.run.v1.RunState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string user_id = 4 [(buf.validate.field).string.uuid = true];
  // At most this many runs; 0 means 50.
  int32 page_size = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The next_page_token of the previous page; empty for the first.
  string page_token = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// Runs newest first.
message ListRunsResponse {
  repeated UserRun runs = 1;
  // Continues the listing; empty on the last page.
  string next_page_token = 2;
}

message GetRunRequest {
  string run_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRunResponse {
  UserRun run = 1;
  // The runs this one started, oldest first.
  repeated stonks.run.v1.Run children = 2;
  repeated Finding findings = 3;
  // The rows this run rejected when its kind is STATEMENT.
  repeated stonks.statement.v1.StatementItem statement_items = 4;
  // The keys this run answered when its kind is RESOLUTION.
  repeated ResolutionItem resolution_items = 5;
  // The keys this run fetched when its kind is FETCH.
  repeated FetchItem fetch_items = 6;
}

message ListFindingsRequest {
  // Includes the findings an administrator has cleared.
  bool include_cleared = 1;
  // Only the findings of this run; unset for every run.
  optional string run_id = 2 [(buf.validate.field).string.uuid = true];
  // At most this many findings; 0 means 50.
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The next_page_token of the previous page; empty for the first.
  string page_token = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// Findings newest first.
message ListFindingsResponse {
  repeated Finding findings = 1;
  // Continues the listing; empty on the last page.
  string next_page_token = 2;
}

message ClearFindingRequest {
  string finding_id = 1 [(buf.validate.field).string.uuid = true];
}

message ClearFindingResponse {}

// One external provider this instance may call.
message Datasource {
  string name = 1;
  bool enabled = 2;
  // Orders answers from several datasources, lowest first, with the name
  // breaking a tie.
  int32 precedence = 3;
  // The address the integration calls; unset for the provider's default.
  optional string endpoint = 4;
}

message ListDatasourcesRequest {}

// Datasources in precedence order.
message ListDatasourcesResponse {
  repeated Datasource datasources = 1;
}

// The kind of data a fetch requests.
enum FetchKind {
  FETCH_KIND_UNSPECIFIED = 0;
  FETCH_KIND_IDENTITY = 1;
}

// What a block suppresses.
enum BlockScope {
  BLOCK_SCOPE_UNSPECIFIED = 0;
  // Calls sent under one identifier.
  BLOCK_SCOPE_IDENTIFIER = 1;
  // Every call to the datasource for the kind of data.
  BLOCK_SCOPE_DATASOURCE = 2;
}

// A call that failed unrecoverably, suppressing further calls until an
// administrator clears it.
message Block {
  string id = 1;
  string datasource = 2;
  FetchKind kind = 3;
  BlockScope scope = 4;
  // The identifier blocked; set only when the scope is IDENTIFIER.
  stonks.type.v1.Identifier sent = 5;
  string reason = 6;
  // The fetch run whose call created the block.
  string run_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // When an administrator cleared the block; unset while it holds.
  google.protobuf.Timestamp cleared_at = 9;
}

message ListBlocksRequest {
  // Includes the blocks an administrator has cleared.
  bool include_cleared = 1;
  // At most this many blocks; 0 means 50.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The next_page_token of the previous page; empty for the first.
  string page_token = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// Blocks newest first.
message ListBlocksResponse {
  repeated Block blocks = 1;
  // Continues the listing; empty on the last page.
  string next_page_token = 2;
}

message ClearBlockRequest {
  string block_id = 1 [(buf.validate.field).string.uuid = true];
}

message ClearBlockResponse {}

service AdminService {
  // Lists every user's runs matching the filters.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // Reads any user's run with its items, children and findings.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // Lists findings across every run.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  // Clears a finding. A finding reporting a block is cleared only by
  // clearing the block, and is refused as a failed precondition. Clearing a
  // cleared finding succeeds.
  rpc ClearFinding(ClearFindingRequest) returns (ClearFindingResponse);
  // Lists the datasources this instance has registered. The credential is
  // never read.
  rpc ListDatasources(ListDatasourcesRequest) returns (ListDatasourcesResponse);
  // Lists datasource blocks.
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
  // Clears a block and the finding reporting it. Clearing a cleared block
  // succeeds.
  rpc ClearBlock(ClearBlockRequest) returns (ClearBlockResponse);
}
