// The external providers this instance may call, and their settings.

syntax = "proto3";

package stonks.admin.datasource.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "run/v1/run.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/datasource/v1;admindatasourcev1";

// One external provider this instance may call.
message Datasource {
  // Selects the integration.
  string name = 1;
  bool enabled = 2;
  // Orders responses from several datasources, lowest first, with the name
  // breaking a tie.
  int32 precedence = 3;
  // The address the row sets; empty for the provider's default.
  string endpoint = 4;
  // The address the integration calls when the row sets none; empty when
  // this build carries no integration of the name. A client shows it where
  // endpoint is empty and saves endpoint unchanged. An empty endpoint then
  // keeps following the build's default.
  string default_endpoint = 5;
  // Empty when none is held.
  string credential = 6;
  // Settings that only the datasource's integration reads.
  google.protobuf.Struct config = 7;
}

message ListDatasourcesRequest {}

message ListDatasourcesResponse {
  // In precedence order.
  repeated Datasource datasources = 1;
}

message UpdateDatasourceRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  bool enabled = 2;
  // Empty for the provider's default.
  string endpoint = 3;
  // Empty holds none.
  string credential = 4;
  google.protobuf.Struct config = 5;
}

message UpdateDatasourceResponse {
  Datasource datasource = 1;
}

message ReorderDatasourcesRequest {
  // Every datasource's name, in the precedence wanted: the first named is
  // consulted first.
  repeated string names = 1 [(buf.validate.field).repeated.min_items = 1];
}

message ReorderDatasourcesResponse {
  // The rebuild resolved tickers run that the reorder started, pending.
  stonks.run.v1.Run run = 1;
}

// Lists the datasources and sets their settings and precedence.
service DatasourceService {
  // Lists the datasources this instance has registered.
  rpc ListDatasources(ListDatasourcesRequest) returns (ListDatasourcesResponse);
  // Sets a datasource's state and settings as given, taking effect at once.
  // The call fails with a failed precondition, and writes nothing, when the
  // change would enable a datasource that has no integration in this build
  // or whose integration refuses the config.
  rpc UpdateDatasource(UpdateDatasourceRequest) returns (UpdateDatasourceResponse);
  // Orders the datasources by precedence. The call starts a rebuild resolved
  // tickers run. Ticker validity and the names of tickers follow the new order
  // once the run finishes. The list must name every datasource exactly once,
  // or the call is refused before it starts a run.
  rpc ReorderDatasources(ReorderDatasourcesRequest) returns (ReorderDatasourcesResponse);
}
