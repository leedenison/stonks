// Every user's runs, their items and their findings.

syntax = "proto3";

package stonks.admin.run.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "admin/replay/v1/replay.proto";
import "run/v1/run.proto";
import "statement/v1/statement.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/admin/run/v1;adminrunv1";

// A run and its user. A system run has no user.
message UserRun {
  stonks.run.v1.Run run = 1;
  optional string user_id = 2;
  optional string user_email = 3;
  // The findings of the run no administrator has cleared.
  int32 open_findings = 4;
  // Whether the run matches the listing's filters. Where it does not, the
  // listing includes it only as an ancestor of one that does.
  bool matched = 5;
  // The runs this one started that the listing holds, oldest first.
  repeated UserRun children = 6;
  // The datasource a FETCH run asked; unset for any other kind.
  optional string datasource = 7;
  // The address a FETCH run called; unset for any other kind.
  optional string endpoint = 8;
}

// What one key of a fetch got.
enum FetchOutcome {
  FETCH_OUTCOME_UNSPECIFIED = 0;
  // The datasource returned a result set, possibly empty.
  FETCH_OUTCOME_SERVED = 1;
  // The integration declared the key out of its scope, so no call was made.
  FETCH_OUTCOME_NOT_SERVED = 2;
  // An open block suppressed the call.
  FETCH_OUTCOME_BLOCKED = 3;
  // The calls failed with a temporary error. A later fetch asks again.
  FETCH_OUTCOME_FAILED_TEMPORARY = 4;
  // The calls failed with a permanent error, and the run wrote a block.
  FETCH_OUTCOME_FAILED_PERMANENT = 5;
}

// One stated key a fetch asked a datasource about, with its outcome.
message FetchItem {
  // The stated key that asked for the request; unset where none did, or
  // where the key was swept.
  stonks.type.v1.StatedKey stated_key = 1;
  // Identifies the key across runs.
  optional string stated_key_id = 2;
  FetchOutcome outcome = 3;
  // The number of calls that carried the key; zero when the datasource was
  // paused or the answer came from the cache.
  int32 attempts = 4;
  // The identifier that carried the request, or the domain: an identifier
  // with no value. Unset when it was not served.
  stonks.type.v1.Identifier sent = 5;
  // The datasource's error; unset when the key was served.
  optional string reason = 6;
}

// An assertion a run wrote: that a ticker names an instrument, or names
// nothing, on one day.
message AssertionItem {
  string id = 1;
  stonks.type.v1.MarketTicker ticker = 2;
  // The day the assertion holds, as YYYY-MM-DD.
  string asserted_on = 3;
  // The instrument the ticker names; unset where the ticker names nothing.
  optional string instrument_id = 4;
  oneof source {
    // The datasource whose answer made the assertion.
    string datasource = 5;
    // The email of the administrator who attested it.
    string attested_by = 6;
  }
}

enum FindingKind {
  FINDING_KIND_UNSPECIFIED = 0;
  // The run wrote a datasource block, which withholds calls until an
  // administrator clears it.
  FINDING_KIND_BLOCK = 1;
  // The resolution dropped a set of identifiers a datasource offered because
  // it contradicted the stated data, a higher precedence response or the
  // winner.
  FINDING_KIND_DROPPED = 2;
  // Two sources name different instruments for one key: the identifiers the
  // key states, the user's confirmed keys, or a response. The database's
  // precedence or the datasources decided between them.
  FINDING_KIND_CONTRADICTION = 3;
  // The response merged two instruments.
  FINDING_KIND_MERGED = 4;
  // Two datasources asserted different things for one value on one day, and
  // precedence kept one. The detail names the value, the day and the
  // datasources.
  FINDING_KIND_DISAGREEMENT = 5;
  // A witnessed event fell between two assertions that name one instrument,
  // and the event wins over the bracket. The detail names the value, the
  // event's day and the instrument.
  FINDING_KIND_BROKEN_VALIDITY_BRACKET = 6;
  // Two assertions imply an event on one of a run of days, and a
  // datasource's coverage holds every one of those days. The datasource
  // reported no event there. The coverage wins. The detail names the value,
  // the days of the assertions, the datasource and its coverage.
  FINDING_KIND_MISSED_EVENT = 7;
}

// The step of the choice that dropped a set of identifiers.
enum DropStep {
  DROP_STEP_UNSPECIFIED = 0;
  // The set contradicted the stated data.
  DROP_STEP_STATED = 1;
  // The set was inconsistent with a higher precedence response.
  DROP_STEP_PRECEDENCE = 2;
  // The set shared neither a stable identifier nor a same-day ticker in one
  // market with the winner.
  DROP_STEP_CORROBORATION = 3;
}

// Something a run met that an administrator may need to see.
message Finding {
  string id = 1;
  string run_id = 2;
  // What the finding reports. It decides which optional fields are set.
  FindingKind kind = 3;
  // The block reported; set only when the kind is BLOCK.
  optional string block_id = 4;
  // The finding's stated key; set for DROPPED, CONTRADICTION and MERGED.
  optional string stated_key_id = 5;
  // What the key concerned states: the finding's own key, or for a block
  // the key whose call created it. Unset where no key is concerned.
  stonks.type.v1.StatedKey stated_key = 6;
  // The step that dropped the set of identifiers; present only when the kind
  // is DROPPED.
  optional DropStep step = 7;
  // The grounds, in words; for a BLOCK, the block's reason.
  optional string detail = 8;
  google.protobuf.Timestamp created_at = 9;
  // When an administrator cleared the finding; unset while it is open.
  google.protobuf.Timestamp cleared_at = 10;
}

// Each filter left unset matches every run.
message ListRunsRequest {
  optional stonks.run.v1.RunKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional stonks.run.v1.RunTrigger trigger = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional stonks.run.v1.RunState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string user_id = 4 [(buf.validate.field).string.uuid = true];
  // At most this many top-level runs; 0 means 50.
  int32 page_size = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The next_page_token of the previous page; empty for the first.
  string page_token = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message ListRunsResponse {
  // The top-level runs, newest first, each with the runs below it that the
  // filters match and the path to them.
  repeated UserRun runs = 1;
  // Continues the listing; empty on the last page.
  string next_page_token = 2;
}

message GetRunRequest {
  string run_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRunResponse {
  // The run, with every run below it nested under children.
  UserRun run = 1;
  // The runs above this one, the top-level run first, each without children.
  repeated UserRun ancestors = 2;
  // The findings of the run and of every run below it, in tree order: a
  // run's findings oldest first, then those of each run below it in turn.
  repeated Finding findings = 3;
  // What this run re-resolves when its kind is REPLAY.
  stonks.admin.replay.v1.Replay replay = 4;
}

message ListRunItemsRequest {
  string run_id = 1 [(buf.validate.field).string.uuid = true];
  // At most this many items; 0 means 50.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The next_page_token of the previous page; empty for the first. The token
  // is opaque.
  string page_token = 3;
}

// One item a run wrote, of the run's kind.
message RunItem {
  oneof item {
    // A row a STATEMENT run rejected.
    stonks.statement.v1.StatementItem statement = 1;
    // A key a RESOLUTION run resolved.
    stonks.type.v1.ResolutionItem resolution = 2;
    // A key a FETCH run asked a datasource about.
    FetchItem fetch = 3;
    // An assertion that an EXTEND_VALIDITY run's fetches wrote, or that an
    // ATTESTATION run recorded.
    AssertionItem assertion = 4;
  }
}

message ListRunItemsResponse {
  // A statement run's rejected rows in payload order, a resolution or fetch
  // run's keys in key id order, or an attestation or extend validity run's
  // assertions in id order. A replay run has none.
  repeated RunItem items = 1;
  // Continues the listing; empty on the last page.
  string next_page_token = 2;
}

message ClearFindingRequest {
  string finding_id = 1 [(buf.validate.field).string.uuid = true];
}

message ClearFindingResponse {}

// Reads every user's runs and findings.
service RunService {
  // Lists every user's runs matching the filters.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // Reads any user's run with the runs above and below it and its findings.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // Lists the items a run wrote.
  rpc ListRunItems(ListRunItemsRequest) returns (ListRunItemsResponse);
  // Clears a finding. Where the finding reports a block, only clearing the
  // block clears it, and the call is refused as a failed precondition.
  // Clearing a cleared finding succeeds.
  rpc ClearFinding(ClearFindingRequest) returns (ClearFindingResponse);
}
