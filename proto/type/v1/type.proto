// The types more than one area shares, and the conventions every API in
// stonks follows.
//
// Money and quantities cross the wire as a string holding an exact decimal,
// such as "1234.56" or "-0.0001", never a floating-point field.
//
// A timestamp is a google.protobuf.Timestamp, in UTC. A date with no time
// crosses as a string in ISO 8601 form, such as "2026-09-14".
//
// An interval is half open. Where a message bounds one, it carries valid_from
// and valid_before, and an instant equal to valid_before falls outside it.

syntax = "proto3";

package stonks.type.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/leedenison/stonks/proto/type/v1;typev1";

// A broker whose exports the system accepts.
enum Broker {
  BROKER_UNSPECIFIED = 0;
  // Interactive Brokers.
  BROKER_IBKR = 1;
  BROKER_SCHWAB = 2;
  BROKER_FIDELITY_UK = 3;
}

// What kind of thing an instrument is. A source states the narrowest class it
// can defend, so an internal node is a legal stored value.
//
//   UNKNOWN            type is unknown to the source
//     CASH             money in one currency
//     SECURITY
//       EQUITY         a shareholding, direct or pooled
//         STOCK
//         ETF
//         MUTUAL_FUND
//       FIXED_INCOME
//       DERIVATIVE     a strike quoted in a listing of something else
//         OPTION
//         FUTURE
enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  ASSET_CLASS_UNKNOWN = 1;
  ASSET_CLASS_CASH = 2;
  ASSET_CLASS_SECURITY = 3;
  ASSET_CLASS_EQUITY = 4;
  ASSET_CLASS_STOCK = 5;
  ASSET_CLASS_ETF = 6;
  ASSET_CLASS_MUTUAL_FUND = 7;
  ASSET_CLASS_FIXED_INCOME = 8;
  ASSET_CLASS_DERIVATIVE = 9;
  ASSET_CLASS_OPTION = 10;
  ASSET_CLASS_FUTURE = 11;
}

// How an identifier's domain and value are read.
enum IdentifierType {
  IDENTIFIER_TYPE_UNSPECIFIED = 0;
  IDENTIFIER_TYPE_ISIN = 1;
  IDENTIFIER_TYPE_CUSIP = 2;
  IDENTIFIER_TYPE_CINS = 3;
  IDENTIFIER_TYPE_WERTPAPIER = 4;
  IDENTIFIER_TYPE_OPENFIGI_SHARE_CLASS = 5;
  // A listing.
  IDENTIFIER_TYPE_SEDOL = 6;
  // A listing.
  IDENTIFIER_TYPE_OPENFIGI_COMPOSITE = 7;
  // A listing; the domain is the ISO 10383 operating MIC of the venue.
  IDENTIFIER_TYPE_MIC_TICKER = 8;
  // An option contract.
  IDENTIFIER_TYPE_OCC = 9;
  // A currency, the value an ISO 4217 code. Its listing in its own currency
  // is money in it, and a listing in another currency carries the rate
  // between the two.
  IDENTIFIER_TYPE_CURRENCY = 10;
  // A listing; the domain is the datasource that issued the value.
  IDENTIFIER_TYPE_DATASOURCE_TICKER = 11;
  // The domain is the broker that issued the value.
  IDENTIFIER_TYPE_BROKER_ID = 12;
  // A line's description as the broker states it; the domain is the broker
  // that stated the value.
  IDENTIFIER_TYPE_BROKER_DESCRIPTION = 13;
  // An option contract's symbol in the OCC format, built from the terms a
  // broker states. It equals the contract's OCC symbol where the clearing
  // house lists the contract. A datasource that lists the contract writes
  // the OCC identifier.
  IDENTIFIER_TYPE_OPTION = 14;
}

// A name for an instrument or for one of its listings.
message Identifier {
  IdentifierType type = 1;
  // Qualifies the value for a type that has a domain; empty otherwise.
  string domain = 2;
  string value = 3;
}

// How a ticker relates to an instrument it named.
enum TickerRelation {
  TICKER_RELATION_UNSPECIFIED = 0;
  // The ticker still names the instrument.
  TICKER_RELATION_CURRENT = 1;
  // The ticker now names another instrument.
  TICKER_RELATION_DEFUNCT = 2;
  // The ticker names nothing now.
  TICKER_RELATION_FORMER = 3;
}

// A ticker at its market, the key of a ticker's identifier facts. A market
// is a set of operating MICs across which one ticker names one instrument on
// a day.
message MarketTicker {
  string market = 1 [(buf.validate.field).string.min_len = 1];
  string value = 2 [(buf.validate.field).string.min_len = 1];
}

// What one source states about an instrument.
message StatedKey {
  repeated Identifier identifiers = 1;
  AssetClass asset_class = 2;
  // The currency of the source line stating the instrument.
  optional string currency = 3;
}

// What a run of kind RESOLVE_STMT_KEYS made of one stated key.
enum ResolutionOutcome {
  RESOLUTION_OUTCOME_UNSPECIFIED = 0;
  // The key was associated with an instrument.
  RESOLUTION_OUTCOME_MATCHED = 1;
  // The key contradicts the reference data it names, and its rows were refused.
  RESOLUTION_OUTCOME_REJECTED = 2;
  // The key was attempted and nothing resolved it, or every candidate was dropped.
  RESOLUTION_OUTCOME_UNRECOGNISED = 3;
  // Nothing served the key and a datasource serving it failed or was blocked.
  RESOLUTION_OUTCOME_UNAVAILABLE = 4;
}

// What settled an association among candidates.
enum Arbiter {
  ARBITER_UNSPECIFIED = 0;
  // The identifiers the key states, read against the database, left one.
  ARBITER_STATED = 1;
  // A datasource answered for an identifier the key states and left one.
  ARBITER_DATASOURCE = 2;
  // A guess's rank settled it.
  ARBITER_GUESS = 3;
  // The user confirmed a candidate for the key.
  ARBITER_USER = 4;
}

// One stated key with what a resolution made of it.
message ResolutionItem {
  StatedKey stated_key = 1;
  // Identifies the key across runs.
  string stated_key_id = 2;
  ResolutionOutcome outcome = 3;
  // Why the key did not match. Where datasources were asked, each has one
  // entry.
  repeated string reasons = 4;
  // The arbiter of the key's current association; unset while the key has
  // none.
  Arbiter arbiter = 5;
  // The number of sets of identifiers that the user may pick. These are the
  // sets the resolution dropped only because the key was sent under a ticker
  // without its venue, and the sets that survived a venue ticker when no set
  // names that venue. Zero means there is nothing to choose. See
  // FindCandidates.
  int32 offered = 6;
  // The MIC_TICKER of a dated association; unset for a fixed association or
  // none.
  Identifier ticker = 7;
}
