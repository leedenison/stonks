// Instruments: the things that can be held and priced. Every RPC requires a
// session.

syntax = "proto3";

package stonks.instrument.v1;

import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/instrument/v1;instrumentv1";

message Instrument {
  // Identifies the instrument in every API; a UUID.
  string id = 1;
  stonks.type.v1.AssetClass asset_class = 2;
  // The user whose statements alone support the instrument; unset when it is
  // system owned.
  optional string owner_id = 3;
  // The instrument grain identifiers naming it, system owned and the
  // caller's own. Empty when only its listings are named.
  repeated stonks.type.v1.Identifier identifiers = 4;
}

// One currency an instrument trades in.
message Listing {
  // Identifies the listing in every API; a UUID.
  string id = 1;
  string instrument_id = 2;
  // The code the listing is quoted in.
  string currency = 3;
  // The user whose statements alone support the listing; unset when it is
  // system owned.
  optional string owner_id = 4;
  // The listing grain identifiers naming it, system owned and the caller's
  // own.
  repeated stonks.type.v1.Identifier identifiers = 5;
}

message ListInstrumentsRequest {}

message ListInstrumentsResponse {}

service InstrumentService {
  // Returns no instruments.
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
}
