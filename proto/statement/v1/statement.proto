// The broker neutral format a statement of transactions is expressed in.
//
// A statement claims every account the user holds at its broker over its
// period. Ingestion replaces every transaction of that user and broker
// whose order date lies in the range.  Re-upload is idempotent and an empty
// range is a deletion.
//
// A row is one leg: one stated key and one quantity.

syntax = "proto3";

package stonks.statement.v1;

import "buf/validate/validate.proto";
import "run/v1/run.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/stonks/proto/statement/v1;statementv1";

// One leg: a change in the quantity of one instrument, stated as at a date.
// Each field mirrors Transaction in meaning. None carries a constraint, so that
// an invalid row is rejected on its own rather than failing the statement.
message Row {
  stonks.type.v1.StatedKey key = 1;
  string order_date = 2;
  string settlement_date = 3;
  string as_at = 4;
  string quantity = 5;
}

// The change in units between old and new as the export states it: 1 old to
// 10 new for a ten-for-one split.
message SplitRatio {
  string from = 1 [(buf.validate.field).string.pattern = "^-?\\d+(\\.\\d+)?$"];
  string to = 2 [(buf.validate.field).string.pattern = "^-?\\d+(\\.\\d+)?$"];
}

// A split as the export states it.
message StatedSplit {
  option (buf.validate.message).cel = {
    id: "stated_split.currency"
    message: "key.currency must be an ISO 4217 code"
    expression: "!has(this.key.currency) || this.key.currency.matches('^[A-Z]{3}$')"
  };
  option (buf.validate.message).cel = {
    id: "stated_split.identifiers"
    message: "every key identifier must have a type and a value"
    expression: "this.key.identifiers.all(i, i.type != 0 && i.value != '')"
  };

  stonks.type.v1.StatedKey key = 1 [(buf.validate.field).required = true];
  string effective_date = 2 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // The change in units the export states; negative for a short position.
  string quantity = 3 [(buf.validate.field).string.pattern = "^-?\\d+(\\.\\d+)?$"];
  // Unset when the export states no ratio.
  SplitRatio ratio = 4;
}

message Statement {
  option (buf.validate.message).cel = {
    id: "statement.period"
    message: "order_from must precede order_before"
    expression: "this.order_from < this.order_before"
  };

  stonks.type.v1.Broker broker = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The first order date claimed.
  string order_from = 2 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // The day after the last order date claimed.
  string order_before = 3 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // The legs the statement carries.
  repeated Row rows = 4 [(buf.validate.field).repeated.max_items = 50000];
  // The splits the export states.
  repeated StatedSplit splits = 5 [(buf.validate.field).repeated.max_items = 1000];
}

// One ingestion of a statement.
// Rows less rejected is the number of transactions written.
message StatementSummary {
  stonks.run.v1.Run run = 1;
  stonks.type.v1.Broker broker = 2;
  string order_from = 3;
  string order_before = 4;
  // The rows the statement carried.
  int32 rows = 5;
  // The rows rejected, each an item.
  int32 rejected = 6;
}

// A rejected row: its position in the statement, why, and the row as stated.
message StatementItem {
  int32 ordinal = 1;
  string reason = 2;
  Row row = 3;
}

message CreateStatementRequest {
  Statement statement = 1 [(buf.validate.field).required = true];
}

// The run ingesting the statement. Its progress and outcome are read through
// the run and through GetStatement.
message CreateStatementResponse {
  stonks.run.v1.Run run = 1;
}

message ListStatementsRequest {}

// The caller's statements, newest first.
message ListStatementsResponse {
  repeated StatementSummary statements = 1;
}

message GetStatementRequest {
  string run_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetStatementResponse {
  StatementSummary statement = 1;
  // In statement order.
  repeated StatementItem items = 2;
}

// Ingests statements and reads what each ingestion did.
service StatementService {
  // Validates the statement, records it and starts its run.
  rpc CreateStatement(CreateStatementRequest) returns (CreateStatementResponse);
  rpc ListStatements(ListStatementsRequest) returns (ListStatementsResponse);
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse);
}
