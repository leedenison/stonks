# The collector between the service and Prometheus.
#
# Spans arrive to be turned into latency and call counts per operation and are
# then dropped: query and command instrumentation emits spans rather than
# histograms, so this connector is the only source of those timings. Metrics
# are held on an endpoint Prometheus scrapes, which means a series exists only
# while the collector still holds it.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Bounds the heap under the container's memory limit, so a burst of spans is
  # refused rather than the container being OOM-killed.
  memory_limiter:
    check_interval: 1s
    limit_mib: 320
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    metrics_flush_interval: 15s
    namespace: spanmetrics

exporters:
  # Resource attributes stay off the metrics: service.instance.id would
  # multiply every series. The exporter derives the job and instance labels
  # from them and publishes the rest once, as target_info.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: false
    enable_open_metrics: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
