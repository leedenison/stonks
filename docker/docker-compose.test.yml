# The integration test stack: Postgres and Redis on their own ports, and a
# tester service that runs go test against them over the compose network. The
# database lives on tmpfs, so every run starts empty.
services:
  postgres:
    image: timescale/timescaledb:2.29.2-pg17
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: stonks
      POSTGRES_PASSWORD: stonks
      POSTGRES_DB: stonks_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonks"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:8.8.2-alpine3.23
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  tester:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile.dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOME: /tmp
      GOFLAGS: -modcacherw
      GOCACHE: /go/.cache/go-build
      STONKS_TEST_DATABASE_URL: postgres://stonks:stonks@postgres:5432/stonks_test?sslmode=disable
      STONKS_TEST_REDIS_URL: redis://redis:6379/0
    volumes:
      - ..:/app
      - go-mod:/go/pkg/mod
      - go-cache:/go/.cache
    entrypoint: []
    command: ["true"]

volumes:
  go-mod:
    name: stonks-go-mod
  go-cache:
    name: stonks-go-cache
