# The edge for the development stack. Routing is as in envoy.yaml, with the
# front end route also accepting websocket upgrades, which hot reloading uses,
# and carrying no timeout, so the first compile of a route is not cut off.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/stonks." }
                          route: { cluster: stonks }
                        - match: { prefix: "/" }
                          route:
                            cluster: client
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: websocket

  clusters:
    - name: stonks
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: stonks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: stonks, port_value: 8090 }

    - name: client
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: client
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: client, port_value: 3000 }
