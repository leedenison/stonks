# Authored, not recorded: the only traffic in the e2e suite the provider did
# not send. The proxy answers these before the recording, once each in order,
# so the first fetch of Apple's ISIN is refused for its rate three times, the
# fetch's whole allowance, and the replay an administrator starts is served
# from the recording. No Ratelimit-Reset header, so the fetch retries on its
# own short backoff.
---
version: 2
interactions:
    - id: 0
      request:
        method: POST
        url: https://api.openfigi.com/v3/mapping
        body: '[{"idType":"ID_ISIN","idValue":"US0378331005","currency":"USD"}]'
      response:
        status: 429 Too Many Requests
        code: 429
        body: Too Many Requests
    - id: 1
      request:
        method: POST
        url: https://api.openfigi.com/v3/mapping
        body: '[{"idType":"ID_ISIN","idValue":"US0378331005","currency":"USD"}]'
      response:
        status: 429 Too Many Requests
        code: 429
        body: Too Many Requests
    - id: 2
      request:
        method: POST
        url: https://api.openfigi.com/v3/mapping
        body: '[{"idType":"ID_ISIN","idValue":"US0378331005","currency":"USD"}]'
      response:
        status: 429 Too Many Requests
        code: 429
        body: Too Many Requests
