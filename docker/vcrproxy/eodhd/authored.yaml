# Authored, not recorded: the only EODHD traffic in the e2e suite the provider
# did not send. The proxy answers these before the recording, once each in
# order, so the first search for Apple's ISIN is refused for its rate three
# times, the fetch's whole allowance, as OpenFIGI's first answer for it is.
# No Retry-After header, so the fetch retries on its own short backoff.
---
version: 2
interactions:
