# Every gate is a make target, and every target runs in a container, so a job is
# `make <target>` with no toolchain setup, and the check name is the target name.
name: CI

on:
  # Started by hand; the pr-merge skill says when.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fmt-check
          - vet
          - lint-go
          - lint-proto
          - lint-ts
          - client-typecheck
          - e2e-typecheck
          - server-test
          - client-test
          - db-test
          - e2e-test
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      # Pulls of images the mirror caches do not count against Docker Hub's limit.
      - name: Pull through mirror.gcr.io
        run: |
          set -euo pipefail
          conf=/etc/docker/daemon.json
          [ -f "$conf" ] || echo '{}' | sudo tee "$conf" > /dev/null
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$conf" | sudo tee "$conf.new" > /dev/null
          sudo mv "$conf.new" "$conf"
          sudo systemctl restart docker
      # Forks have no secrets, so the login is skipped.
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: make ${{ matrix.target }}

  # gates passes only when every matrix target passes.
  gates:
    name: gates
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.check.result }}" = success ] || exit 1
